# Publishes the Orca Slicer printer agent (orca_plugin/) to the Orca Cloud Plugin Hub.
#
# Off until you turn it on: connect this repository to your plugin on cloud.orcaslicer.com
# (Plugins > Shared > the plugin > Edit plugin > GitHub publishing), then set the repository
# variable ORCACLOUD_PUBLISH to "true" (Settings > Secrets and variables > Actions > Variables).
#
# Only releases tagged orca-plugin-vX.Y.Z publish, so the dashboard's own v* releases never do.
# The tag version must equal the version in the plugin's PEP 723 header and be higher than the
# version already on Orca Cloud. No secrets: GitHub OIDC (audience "orcacloud") proves identity.
# See docs/ORCA_PLUGIN.md and https://cloud.orcaslicer.com/wiki/#publish-from-github
name: Publish Orca plugin to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  PLUGIN_FILES: "orca_plugin/os3dpms_printer_agent_any.py"

jobs:
  publish:
    if: vars.ORCACLOUD_PUBLISH == 'true' && startsWith(github.event.release.tag_name, 'orca-plugin-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#orca-plugin-v}"
          header="$(sed -n 's/^# version = "\(.*\)"$/\1/p' orca_plugin/os3dpms_printer_agent_any.py)"
          code="$(sed -n 's/^PLUGIN_VERSION = "\(.*\)"$/\1/p' orca_plugin/os3dpms_printer_agent_any.py)"
          echo "tag=$tag header=$header code=$code"
          [ "$tag" = "$header" ] && [ "$tag" = "$code" ]

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -er .value)"
          version="${GITHUB_REF_NAME#orca-plugin-v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
