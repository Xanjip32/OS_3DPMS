name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check --select E9,F,B --target-version py38 .
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee test.log || {
            # Failing tests as annotations: they show on the run page without signing in.
            grep -E "^(FAIL|ERROR):|^[A-Za-z.]*(Error|Exception)" test.log | head -10 | sed 's/^/::error::/'
            exit 1
          }
