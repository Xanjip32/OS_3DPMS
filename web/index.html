<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Printers</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f6f8fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Printers">
<link rel="stylesheet" href="/app.css">
</head>
<body class="dashboard-page">
<header class="app-header">
  <a class="brand" href="/"><img src="/icon-192.png" alt="" width="30" height="30">OS_3DPMS</a>
  <nav aria-label="Main">
    <a href="/" aria-current="page">Dashboard</a>
    <a id="setup-link" class="hidden" href="/setup">Setup</a>
  </nav>
  <div class="header-actions">
    <span class="menu-wrap">
      <button id="hidden-btn" class="hidden" aria-haspopup="true" aria-expanded="false"></button>
      <div id="hidden-menu" class="menu hidden"></div>
    </span>
    <button id="install" class="hidden" title="Install as an app on this device">Install app</button>
    <button id="alerts" class="hidden" title="Show a pop-up when a print finishes or fails">Enable alerts</button>
  </div>
</header>
<main class="grid" id="grid" aria-label="Printer dashboard"></main>

<div id="modal">
  <div class="mtop">
    <span class="name" id="mname"></span><span class="grow"></span>
    <button id="mopen">Open Mainsail</button><button id="mclose">Close (Esc)</button>
  </div>
  <img id="mimg" alt="">
</div>
<div id="toasts"></div>

<template id="tile-template">
  <section class="tile nocam">
    <div class="top"><span class="name"></span><span class="chip"></span>
      <button class="hide" title="Hide this camera on this device" aria-label="Hide this camera">×</button></div>
    <button type="button" class="view">
      <img alt="">
      <span class="nocam">Connecting to camera…</span>
      <span class="open" aria-hidden="true"></span>
    </button>
    <div class="progress"><div></div></div>
    <div class="file"></div>
    <div class="bar">
      <button class="primary send">Send file</button>
      <span class="grow"></span>
      <button class="live">Camera</button>
      <button class="ui">Mainsail</button>
    </div>
    <div class="drop"></div>
    <div class="confirm">
      <div>Send to <b class="target"></b>:</div>
      <div class="fname"></div>
      <label><input type="checkbox" class="start"> Start print after upload</label>
      <div class="warn hidden">Check that the bed is clear before starting a print remotely.</div>
      <div class="row"><button class="primary go">Send</button><button class="cancel">Cancel</button></div>
    </div>
    <input type="file" accept=".gcode,.gco,.g,.3mf" hidden>
  </section>
</template>

<script src="/app.js"></script>
</body>
</html>
