<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - OpenPrintDeck</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="stylesheet" href="/app.css">
</head>
<body class="login-page">
<main class="login-box">
  <h1><img src="/logo.svg" alt="OpenPrintDeck" width="220" height="48"></h1>
  <form id="login-form">
    <label>User name <input id="user" name="user" autocomplete="username" required maxlength="64"></label>
    <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <button type="submit" class="primary">Sign in</button>
    <p id="login-error" class="login-error" role="alert"></p>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
